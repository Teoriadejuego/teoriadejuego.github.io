name: Validate and deploy portfolio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install browser dependencies
        timeout-minutes: 5
        run: python -m playwright install --with-deps chromium firefox
      - run: python tools/fetch_axe.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python build.py
      - run: python tests/check_static.py
      - run: python tools/release.py verify
      - run: python tools/check_browser.py --firefox
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: public
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
  confirm:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python build.py
      - name: Confirm served revision and bytes
        run: |
          python - <<'PY'
          import os, subprocess, sys, time
          for attempt in range(6):
              result = subprocess.run([sys.executable, 'tools/release.py', 'verify-remote',
                                       '--expected-revision', os.environ['GITHUB_SHA']])
              if result.returncode == 0:
                  break
              if attempt < 5:
                  time.sleep(10)
          else:
              raise SystemExit('Published files could not be confirmed after bounded retries')
          PY
